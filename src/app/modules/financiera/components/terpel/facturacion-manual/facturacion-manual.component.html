<div
  class="bg-white dark:bg-gray-800 relative shadow-md sm:rounded-lg overflow-hidden p-4 mb-4 flex flex-col"
>
  <!-- Subtítulo del container -->
  <h3 class="text-2xl font-semibold text-gray-800 dark:text-white mb-4">
    Reportar en Base de Datos
  </h3>

  <!-- Input para subir el archivo Excel -->
  <div>
    <input
      type="file"
      (change)="onFileChange($event)"
      accept=".xlsx, .xls"
      #fileInput
    />
  </div>

  <!-- Mensaje que indica la cantidad de registros encontrados -->
  <div *ngIf="recordsCount !== null" class="mt-4">
    <p>
      Se encontraron <strong>{{ recordsCount }}</strong> registros para
      reportar.
    </p>
  </div>

  <!-- Indicador de carga -->
  <div *ngIf="isLoading" class="mt-4">
    <p>Cargando, por favor espere...</p>
    <!-- Aquí podrías agregar un spinner si tienes uno, por ejemplo:
         <mat-spinner diameter="40"></mat-spinner> -->
  </div>

  <!-- Botón para enviar registros a la BD -->
  <div class="mt-6 mx-auto">
    <button
      class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded"
      [disabled]="!recordsCount || isLoading"
      (click)="reportarBD()"
    >
      Reportar en BD
    </button>
  </div>
</div>
