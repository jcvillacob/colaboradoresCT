<h2 class="text-4xl font-bold pt-5 ml-5">Conciliación Diarias</h2>

<div class="container mx-auto p-6">
    <div class="flex flex-col md:flex-row md:space-x-8 space-y-6 md:space-y-0">

        <!-- CONTROLES -->
        <div class="flex-1 flex flex-col space-y-4 max-w-md">
            <!-- Subir archivos -->
            <label for="fileInput"
                class="cursor-pointer bg-primary-600 hover:bg-primary-700 text-white font-semibold px-5 py-2 rounded-lg shadow transition">
                📂 Seleccionar archivos
            </label>
            <input id="fileInput" type="file" (change)="onFilesSelected($event)"
                accept=".csv, .xlsx, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel"
                multiple class="hidden" />

            <!-- Días + Cruzar -->
            <div class="flex items-end space-x-4">
                <div class="flex items-center space-x-2">
                    <label for="daysInput" class="text-gray-700 font-medium">Días:</label>
                    <input id="daysInput" type="number" [(ngModel)]="days" min="1"
                        class="w-20 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500" />
                </div>
                <button (click)="onCross()"
                    class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-2 rounded-lg shadow transition">
                    Cruzar
                </button>
            </div>
        </div>

        <!-- LISTA DE ARCHIVOS -->
        <div *ngIf="files.length" class="flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div *ngFor="let f of files" class="p-4 bg-gray-50 rounded-lg shadow hover:shadow-md transition">
                <p class="text-indigo-600 font-medium truncate mb-1">{{ f.name }}</p>
                <p class="text-sm text-gray-500">{{ (f.size / 1024) | number:'1.0-2' }} KB</p>
            </div>
        </div>

    </div>
</div>
